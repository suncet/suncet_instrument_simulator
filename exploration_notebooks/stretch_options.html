<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SunCET | Local stretch study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101113;color:#eee;font:15px system-ui;letter-spacing:0}header{padding:20px 24px;border-bottom:1px solid #393b3d}h1{font-size:24px;margin:0 0 8px}p{margin:0;color:#b9bdc1}.toolbar{position:sticky;top:0;z-index:2;background:#202225;padding:12px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}label{display:flex;align-items:center;gap:10px}select,button{font:inherit;color:inherit;background:#292d30;border:1px solid #666;padding:8px;border-radius:4px}a{color:#8cd7de}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;padding:24px;max-width:1600px;margin:auto}article{min-width:0}article img{width:100%;aspect-ratio:4/3;object-fit:contain;background:black;display:block}h2{font-size:17px;margin:10px 0 6px}.limits{font-variant-numeric:tabular-nums;color:#c4cccf;font-size:14px}details{margin-top:5px;font-size:13px;color:#aeb5bd}dialog{background:#151719;color:white;border:1px solid #555;max-width:1100px;width:95vw;padding:14px}dialog::backdrop{background:#000c}dialog img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain}dialog .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}#close{font-size:22px;width:42px;height:42px;padding:0}#image-title{font-size:17px;margin:0}button.picture{display:block;border:0;padding:0;width:100%;cursor:zoom-in;background:black}@media(max-width:650px){main{grid-template-columns:1fr;padding:12px}.toolbar{padding:10px;gap:10px}label{width:100%;justify-content:space-between}select{max-width:68%}header{padding:16px}h1{font-size:21px}}
article img{height:auto}
</style></head><body>
<header><h1>SunCET | Stretch options</h1><p>Local study / Frame 300 / Exposure-normalized DN/s</p></header>
<div class="toolbar"><label>Palette <select id="palette" aria-label="Palette"></select></label><label>Radial filter <select id="mode" aria-label="Radial filter"><option value="unfiltered">Off / original DN/s</option><option value="filtered">On / gallery Gaussian, sigma 300 px</option></select></label><a id="overview" href="overview-unfiltered.jpg" target="_blank">Overview</a><a href="manifest.json">Parameters</a></div>
<main id="grid"></main>
<dialog id="preview"><div class="bar"><h2 id="image-title"></h2><button id="close" aria-label="Close preview" title="Close preview">&times;</button></div><img id="full" alt=""><p id="image-limits"></p><a id="download">Full-resolution PNG</a></dialog>
<script>
const study=__DATA__;
const $=id=>document.getElementById(id);
for(const p of study.palettes){const o=new Option(p.title,p.slug);$('palette').add(o)}
function render(){const mode=$('mode').value,palette=$('palette').value;$('overview').href=`overview-${mode}.jpg`;$('grid').replaceChildren();study.modes[mode].forEach((e,i)=>{const article=document.createElement('article');const base=`${mode}/${palette}/${e.slug}`;const limits=`vmin ${e.vmin.toLocaleString(undefined,{maximumFractionDigits:4})} / vmax ${e.vmax.toLocaleString(undefined,{maximumFractionDigits:2})} DN/s`;article.innerHTML=`<button class="picture" aria-label="Preview ${e.title}"><img src="${base}.webp" alt="${e.title}" loading="lazy" width="500" height="375"></button><h2>${String(i+1).padStart(2,'0')} / ${e.title}</h2><p class="limits">${limits}</p><details><summary>Transfer function</summary>${e.detail}</details>`;article.querySelector('button').onclick=()=>{$('full').src=base+'.png';$('full').alt=e.title;$('image-title').textContent=e.title;$('image-limits').textContent=limits;$('download').href=base+'.png';$('preview').showModal()};$('grid').append(article)})}
$('palette').onchange=render;$('mode').onchange=render;$('close').onclick=()=>$('preview').close();render();
</script></body></html>
